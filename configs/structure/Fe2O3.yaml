# Fe2O3 (Iron Oxide) Structure Configuration
# ===========================================

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# Initialization method: from_cif, random_icp, pymatgen
init: from_cif

# CIF file path
cif_path: ${structure.root_dir}/crystal-structures/epsilon_Fe2O3_sc2x2x5.cif

# Target density for scaling (g/cm³)
target_density: 4.71

# Structure properties
species: [Fe, O]
stoichiometry: [2, 3]

# Random initialization settings (if init=random_icp)
box_length: 25.0
