# 70Li2S-30P2S5 Glass — Li-free structure
# Supercell: 5×8×5 of Li7P3S11, Li removed after generation

root_dir: ${oc.env:PROJECT_ROOT,./}/data

init: from_cif
cif_path: ${structure.root_dir}/crystal-structures/glass_70Li2S_noLi.cif

target_density: 1.85

species: [P, S]
stoichiometry: [1200, 3865]

central_element: P
neighbor_elements: [P, S]
order_param_cutoff: 5.5
order_params: [tet, cn, q4]

# Non-cubic box: ~30.94 × 101.02 × 63.37 Å
box_length: 58.3
