# NaTaCl6 Structure Configuration
# =================================

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# Initialization method: from_cif, random_icp, pymatgen
init: from_cif

# CIF file path
cif_path: ${structure.root_dir}/crystal-structures/NaTaCl6.cif

# Target density for scaling (g/cm³)
target_density: 3.10

# Structure properties
species: [Na, Ta, Cl]
stoichiometry: [1, 1, 6]

# Random initialization settings (if init=random_icp)
box_length: 30.0
