# Li-P-S Glass Structure Configuration
# =====================================

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# Initialization method: from_cif, random_icp, pymatgen
init: from_cif

# CIF file path
cif_path: ${structure.root_dir}/crystal-structures/glass_67Li2S_small.cif

# Target density (g/cm³)
target_density: 1.85

# Structure properties
species: [P, S]
stoichiometry: [72, 211]

# Order parameters
central_element: P
neighbor_elements: [P, S]
order_param_cutoff: 5.5
order_params: [tet, cn, q4]

# Random initialization settings (if init=random_icp)
box_length: 47.5
