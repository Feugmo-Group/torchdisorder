# 75Li2S-25P2S5 Glass — Li-free structure
# Supercell: 5×6×9 of Li3PS4_beta, Li removed after generation

root_dir: ${oc.env:PROJECT_ROOT,./}/data

init: from_cif
cif_path: ${structure.root_dir}/crystal-structures/glass_75Li2S_noLi.cif

target_density: 1.85

species: [P, S]
stoichiometry: [1080, 3886]

central_element: P
neighbor_elements: [P, S]
order_param_cutoff: 5.5
order_params: [tet, cn, q4]

# Non-cubic box: ~60.09 × 49.31 × 55.08 Å
box_length: 54.6
