# 75Li2S-25P2S5 Glass — Li-free, full supercell
# Supercell: 4×6×8 of Li3PS4_beta (near-cubic ~49 Å), Li removed
# Raw cell: 48.1×49.3×49.0 Å (within 2.5%)  |  MIC cutoff after density scaling: ~24.5 Å

root_dir: ${oc.env:PROJECT_ROOT,./}/data

init: from_cif
cif_path: ${structure.root_dir}/crystal-structures/glass_75Li2S_noLi.cif

target_density: 1.85

species: [P, S]
stoichiometry: [192, 768]

central_element: P
neighbor_elements: [P, S]
order_param_cutoff: 5.5
order_params: [tet, cn, q4]

box_length: 50.0
