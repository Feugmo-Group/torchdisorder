# 75Li2S-25P2S5 Glass — Li-free, small supercell
# Supercell: 2×2×3 of Li3PS4_beta (24×16×18 Å), Li removed
# Atoms: 48P + 192S = 240  |  MIC cutoff after density scaling: ~8 Å

root_dir: ${oc.env:PROJECT_ROOT,./}/data

init: from_cif
cif_path: ${structure.root_dir}/crystal-structures/glass_75Li2S_small_noLi.cif

target_density: 1.85

species: [P, S]
stoichiometry: [48, 192]

central_element: P
neighbor_elements: [P, S]
order_param_cutoff: 5.5
order_params: [tet, cn, q4]

box_length: 16.1
