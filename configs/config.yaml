# TorchDisorder Configuration
# ===========================
#
# Usage:
#   python scripts/train.py                              # Use defaults (SiO2, neutron)
#   python scripts/train.py data=SiO2 structure=silica   # SiO2 glass (neutron)
#   python scripts/train.py data=GeO2 structure=GeO2     # GeO2 glass (neutron)
#   python scripts/train.py data=LiPS structure=LiPS     # Li-P-S glass (X-ray)
#   python scripts/train.py target=F_Q                   # F(Q) target
#   python scripts/train.py target=G_r                   # G(r) target (for X-ray PDF)
#   python scripts/train.py structure.supercell.target_atoms=2000  # Larger cell

experiment_name: ${data.experiment_name}
defaults:
  - data: SiO2  #  SiO2 GeO2, LiPS
  - structure: silica # silica,  GeO2, LiPS
  - trainer: cooper
  - wandb: enabled
  - _self_

# =============================================================================
# Device
# =============================================================================
accelerator: 'cpu'  # cuda, mps, cpu

# =============================================================================
# Target Selection
# =============================================================================
# Options: S_Q, F_Q, T_r, g_r, G_r
#   - S_Q: Structure factor S(Q) → 1 as Q → ∞
#   - F_Q: Reduced structure factor F(Q) = Q[S(Q)-1] → 0 as Q → ∞
#   - g_r: Pair distribution function g(r) → 1 as r → ∞
#   - G_r: Reduced PDF G(r) = 4πρr[g(r)-1] → 0 as r → ∞ (PDFgetX3 output)
#   - T_r: Total correlation function T(r) = 4πρr·g(r)
target: F_Q

# =============================================================================
# Optimization
# =============================================================================
max_steps: 5000
optimize_cell: false

lr:
  primal: 1e-3
  dual: 1e-2
  primal_reduced: 1e-4
  dual_reduced: 1e-3

# =============================================================================
# Adaptive Penalty
# =============================================================================
penalty:
  init: 10.0
  growth_rate: 1.5
  decay_rate: 0.95
  max_penalty: 1000.0
  min_penalty: 1.0
  patience: 10

# =============================================================================
# Stability
# =============================================================================
stability:
  grad_clip_norm: 1.0
  max_displacement: 0.1
  constraint_warmup_steps: 500

# =============================================================================
# Constraints
# =============================================================================
constraints:
  enabled: true
  use_types: all  # 'all' or [tet, cn, q4, ...]
  overlap_repulsion:
    enabled: true
    r_min: 1.0       # Minimum allowed interatomic distance (Angstrom)
    weight: 1.0      # Penalty weight relative to chi2 loss
    chunk_size: null # null = auto-size from free GPU memory
  # Set regenerate_json: true to re-run lps_generator before loading constraints.
  # Requires constraints.generator to be configured (see below).
  regenerate_json: false
  # generator: null  # uncomment and fill in when regenerate_json: true
  #   script: data/cif-generation/lps_generator.py
  #   input_cif: data/base-crystals/Li7P3S11.cif   # base (not glass) crystal
  #   target: 67Li2S-33P2S5                          # or 70Li2S-30P2S5 / 75Li2S-25P2S5
  #   supercell: "4,2,2"
  #   keep_li: false
  #   disorder: 0.3
  #   seed: 42
  #   output_prefix: null  # inferred from json_path when null

# =============================================================================
# MLIP Energy Regularization (optional)
# =============================================================================
mlip:
  enabled: false          # opt-in; the chosen backend package must be installed
  backend: mace           # mace | sevennet | chgnet | m3gnet | orb | mattersim
  model: "small"          # backend-specific model name/size (see docs below)
                          #   mace     : small, medium, large
                          #   sevennet : 7net-0 or path to checkpoint
                          #   chgnet   : ignored (uses default weights)
                          #   m3gnet   : M3GNet-MP-2021.2.8-PES or custom
                          #   orb      : orb_v2, orb_v2_mptraj, etc.
                          #   mattersim: large or small
  force_weight: 1.0e-5    # λ: initial weight; if adaptive_weight=true this is tuned automatically
  apply_every: 50         # apply force penalty every N steps (was 10, too frequent)
  relax_every: 0          # run FIRE relaxation every N steps (0 = disabled)
  relax_max_steps: 20     # max FIRE steps per relaxation call
  warmup_steps: 500       # steps before MACE activates (let scattering converge first)
  max_force_clip: 5.0     # clip per-component forces (eV/Å) — prevents runaway on strained bonds
  adaptive_weight: false  # dynamically adjust force_weight to keep |penalty|/chi2 ≈ target_ratio
  target_ratio: 0.005     # target |penalty|/chi2 (0.5%) — MACE as gentle nudge not dominant
  adapt_rate: 0.15        # multiplicative step size for weight updates (per fire)
  force_weight_min: 1.0e-7  # lower clamp for adaptive weight
  force_weight_max: 1.0e-3  # upper clamp for adaptive weight

# =============================================================================
# Order Parameters
# =============================================================================
order_params:
  backend: auto  # auto, pytorch, warp
  cutoff: 5.5
  max_neighbors: 4

# =============================================================================
# Scattering / KDE
# =============================================================================
scattering:
  # Distances processed per KDE chunk in get_partial_rdf.
  # null = auto-sized from free GPU memory (recommended for most cases).
  # Set an integer (e.g. 20000) if auto-sizing is too aggressive or too
  # conservative for your GPU, or when running on CPU.
  chunk_size: null

# =============================================================================
# Output
# =============================================================================
checkpoint_interval: 200

output:
  write_trajectory: true
  trajectory_path: ${hydra:run.dir}/trajectory
  trajectory_interval: 100  # steps between trajectory frames
  save_plots: true
  plots_dir: ${hydra:run.dir}/plots
  plot_interval: 100

# =============================================================================
# Hydra
# =============================================================================
hydra:
  run:
    dir: outputs/${experiment_name}_${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${experiment_name}_${now:%Y-%m-%d}/${now:%H-%M-%S}
