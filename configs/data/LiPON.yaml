# LiPON (Lithium Phosphorus Oxynitride) Data Configuration
# ==========================================================
# X-ray diffraction data for LiPON glass

experiment_name: LiPON

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# =============================================================================
# Scattering Type: 'neutron' or 'xray'
# =============================================================================
scattering_type: xray

# =============================================================================
# Data Paths
# =============================================================================
data:
  s_of_q_path: ${data.root_dir}/xrd_measurements/li2.99_po3.38_n0.41/F_of_Q.csv
  t_of_r_path: ${data.root_dir}/xrd_measurements/li2.99_po3.38_n0.41/T_of_r.csv
  g_of_r_path: null

  # Input format: null=auto-detect, true=F(Q), false=S(Q)
  # F_of_Q.csv contains F(Q)=Q[S(Q)-1] directly
  input_is_F_Q: true

  # Data subsampling (1 = no subsampling)
  stride_q: 1
  stride_r: 1

# =============================================================================
# Q-space Range (Å⁻¹)
# =============================================================================
# Filter experimental S(Q)/F(Q) data to this range
# Set to null to use full data range
q_min: 0.5
q_max: 20.0

# =============================================================================
# R-space Range (Å)
# =============================================================================
# Used for auto-generating r_bins or filtering loaded data
r_min: 0.01
r_max: 10.0
n_r_bins: 500

# =============================================================================
# Spectrum Calculation
# =============================================================================
kernel_width: 0.035

# =============================================================================
# Neutron Scattering Lengths (fm)
# =============================================================================
neutron_scattering_lengths:
  Li: -1.90
  P: 5.13
  O: 5.803
  N: 9.36

# =============================================================================
# X-ray Form Factor Parameters (Cromer-Mann)
# =============================================================================
xray_form_factor_params:
  Li:
    a: [1.1282, 0.7508, 0.6175, 0.4653]
    b: [3.9546, 1.0524, 85.3905, 168.261]
    c: [0.0377]
  P:
    a: [6.4345, 4.1791, 1.7800, 1.4908]
    b: [1.9067, 27.1570, 0.5260, 68.1645]
    c: [1.1149]
  O:
    a: [3.0485, 2.2868, 1.5463, 0.867]
    b: [13.2771, 5.7011, 0.3239, 32.9089]
    c: [0.2508]
  N:
    a: [12.2126, 3.1322, 2.0125, 1.1663]
    b: [0.0057, 9.8933, 28.9975, 0.5826]
    c: [-11.529]

# =============================================================================
# Order Parameters
# =============================================================================
central: 'P'
neighbour: null
cutoff: 1.95

# =============================================================================
# Constraints
# =============================================================================
json_path: ${data.root_dir}/json/lipon_glass_constraints.json

# =============================================================================
# F_IS order parameter (local inversion symmetry)
# =============================================================================
# LiPON: mostly tetrahedral PO4; slightly distorted tetrahedra → F_IS ≈ -0.20
fis:
  target: -0.20
  weight: 0.5
  cutoff: 1.95
  central_z: 15     # P
  neighbor_z: null  # both O and N
  mode: variable_R

# =============================================================================
# Loss aggregation
# =============================================================================
loss_aggregator:
  name: relobralo
  beta: 0.999
  num_losses: 2

# =============================================================================
# F_IS feedback: dynamic environment priority adjustment
# =============================================================================
fis_feedback:
  enabled: false
  update_interval: 200
  feedback_strength: 2.0
  min_scale: 0.5
  max_scale: 5.0
  warmup_steps: 500
