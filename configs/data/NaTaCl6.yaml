# NaTaCl6 Data Configuration
# ===========================
# X-ray diffraction data for NaTaCl6 glass

experiment_name: NaTaCl6

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# =============================================================================
# Scattering Type: 'neutron' or 'xray'
# =============================================================================
scattering_type: xray

# =============================================================================
# Data Paths
# =============================================================================
data:
  s_of_q_path: ${data.root_dir}/xrd_measurements/NaTaCl6/F_of_Q_actual.csv
  t_of_r_path: ${data.root_dir}/xrd_measurements/NaTaCl6/T_of_r.csv
  g_of_r_path: null

  # Input format: null=auto-detect, true=F(Q), false=S(Q)
  # F_of_Q.csv contains F(Q)=Q[S(Q)-1] directly
  input_is_F_Q: true

  # Data subsampling (1 = no subsampling)
  stride_q: 1
  stride_r: 1

# =============================================================================
# Q-space Range (Å⁻¹)
# =============================================================================
# Filter experimental S(Q)/F(Q) data to this range
# Set to null to use full data range
q_min: 0.5
q_max: 20.0

# =============================================================================
# R-space Range (Å)
# =============================================================================
# Used for auto-generating r_bins or filtering loaded data
r_min: 0.01
r_max: 10.0
n_r_bins: 500

# =============================================================================
# Spectrum Calculation
# =============================================================================
kernel_width: 0.035

# =============================================================================
# Neutron Scattering Lengths (fm)
# =============================================================================
neutron_scattering_lengths:
  Na: 3.63
  Ta: 6.91
  Cl: 9.577

# =============================================================================
# X-ray Form Factor Parameters (Cromer-Mann)
# =============================================================================
xray_form_factor_params:
  Na:
    a: [4.7626, 3.1736, 1.2674, 1.1128]
    b: [3.2850, 8.8422, 0.3136, 129.424]
    c: [0.6760]
  Ta:
    a: [29.2024, 15.2293, 14.5135, 4.7647]
    b: [1.7733, 9.3704, 0.3130, 132.280]
    c: [8.5819]
  Cl:
    a: [11.4604, 7.1964, 6.2556, 1.6455]
    b: [0.0104, 1.1662, 18.5194, 47.7784]
    c: [-9.5574]

# =============================================================================
# Order Parameters
# =============================================================================
central: 'Ta'
neighbour: 'Cl'
cutoff: 2.6

# =============================================================================
# Constraints
# =============================================================================
json_path: ${data.root_dir}/json/natacl6_glass_constraints.json

# =============================================================================
# F_IS order parameter (local inversion symmetry)
# =============================================================================
# NaTaCl6: octahedral Ta-Cl6; perfect inversion → F_IS ≈ 1.0
fis:
  target: 0.90      # slightly below 1.0 to allow amorphous disorder
  weight: 0.5
  cutoff: 2.6
  central_z: 73     # Ta
  neighbor_z: 17    # Cl
  mode: variable_R

# =============================================================================
# Loss aggregation
# =============================================================================
loss_aggregator:
  name: relobralo
  beta: 0.999
  num_losses: 2

# =============================================================================
# F_IS feedback: dynamic environment priority adjustment
# =============================================================================
fis_feedback:
  enabled: false
  update_interval: 200
  feedback_strength: 2.0
  min_scale: 0.5
  max_scale: 5.0
  warmup_steps: 500
