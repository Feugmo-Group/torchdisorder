# Si (Amorphous Silicon) Data Configuration
# ==========================================
# X-ray diffraction data for amorphous silicon

experiment_name: Si

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# =============================================================================
# Scattering Type: 'neutron' or 'xray'
# =============================================================================
scattering_type: xray

# =============================================================================
# Data Paths
# =============================================================================
data:
  s_of_q_path: ${data.root_dir}/xrd_measurements/Si/annealed-S-of-Q.csv
  t_of_r_path: ${data.root_dir}/xrd_measurements/Si/annealed-J-of-R.csv
  g_of_r_path: null

  # Input format: null=auto-detect, true=F(Q), false=S(Q)
  input_is_F_Q: null

  # Data subsampling (1 = no subsampling)
  stride_q: 1
  stride_r: 1

# =============================================================================
# Q-space Range (Å⁻¹)
# =============================================================================
# Filter experimental S(Q)/F(Q) data to this range
# Set to null to use full data range
q_min: 0.5
q_max: 20.0

# =============================================================================
# R-space Range (Å)
# =============================================================================
# Used for auto-generating r_bins or filtering loaded data
r_min: 0.01
r_max: 10.0
n_r_bins: 500

# =============================================================================
# Spectrum Calculation
# =============================================================================
kernel_width: 0.035

# =============================================================================
# Neutron Scattering Lengths (fm)
# =============================================================================
neutron_scattering_lengths:
  Si: 4.1491

# =============================================================================
# X-ray Form Factor Parameters (Cromer-Mann)
# =============================================================================
xray_form_factor_params:
  Si:
    a: [6.2915, 3.0353, 1.9891, 1.541]
    b: [2.4386, 32.3337, 0.6785, 81.6937]
    c: [1.1407]

# =============================================================================
# Order Parameters
# =============================================================================
central: 'Si'
neighbour: 'Si'
cutoff: 2.6

# =============================================================================
# Constraints
# =============================================================================
json_path: ${data.root_dir}/json/si_glass_constraints.json
