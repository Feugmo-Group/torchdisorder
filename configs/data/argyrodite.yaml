# Li-argyrodite (Li₆PS₅X, X = Cl/Br/I) Data Configuration
# Neutron diffraction — update data paths to match your experimental file

root_dir: ${oc.env:PROJECT_ROOT,./}/data

scattering_type: neutron

data:
  s_of_q_path: ${data.root_dir}/xrd_measurements/argyrodite/S_of_Q.csv
  g_of_r_path: ${data.root_dir}/xrd_measurements/argyrodite/g_of_r.csv
  t_of_r_path: null
  input_is_F_Q: false
  stride_q: 1
  stride_r: 1

q_min: 0.5
q_max: 20.0

r_min: 0.01
r_max: 30.0
n_r_bins: 500

kernel_width: 0.03
number_density: 0.0470   # Li6PS5Cl: ~1.80 g/cm³, formula unit 6Li+P+5S+Cl = 13 atoms

neutron_scattering_lengths:
  Li: -1.90
  P:   5.13
  S:   2.847
  Cl:  9.577
  Br:  6.795
  I:   5.28

xray_form_factor_params:
  Li:
    a: [1.1282, 0.7508, 0.6175, 0.4653]
    b: [3.9546, 1.0524, 85.3905, 168.261]
    c: [0.0377]
  P:
    a: [6.4345, 4.1791, 1.78, 1.4908]
    b: [1.9067, 27.157, 0.526, 68.1645]
    c: [1.1149]
  S:
    a: [6.9053, 5.2034, 1.4379, 1.5863]
    b: [1.4679, 22.2151, 0.2536, 56.172]
    c: [0.8669]
  Cl:
    a: [11.4604, 7.1964, 6.2556, 1.6455]
    b: [0.0104, 1.1662, 18.5194, 47.7784]
    c: [-9.5574]

central: 'P'
neighbour: 'S'
cutoff: 5.5

json_path: ${data.root_dir}/json/argyrodite_Li6PS5Cl_constraints.json
