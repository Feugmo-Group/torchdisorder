# Li-P-S Glass Data Configuration
# ================================
# X-ray PDF data for 67Li2S-33P2S5 glass

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# =============================================================================
# Scattering Type: 'neutron' or 'xray'
# =============================================================================
# IMPORTANT: This is X-ray data from PDF analysis!
scattering_type: xray

# =============================================================================
# Data Paths
# =============================================================================
data:
  s_of_q_path: ${data.root_dir}/xrd_measurements/Li3PS4/S_of_Q.csv
  g_of_r_path: ${data.root_dir}/xrd_measurements/Li3PS4/g_of_r.csv
  t_of_r_path: null
  
  # Input format: false=S(Q), true=F(Q), null=auto-detect
  input_is_F_Q: false
  
  # Data subsampling - IMPORTANT for large datasets
  # S_of_Q.csv has 7725 bins - stride_q=4 gives ~1931 bins (much faster!)
  stride_q: 4
  stride_r: 1

# =============================================================================
# Q-space Range (Å⁻¹)
# =============================================================================
# Filter experimental S(Q)/F(Q) data to this range
q_min: 0.5
q_max: 17.5

# =============================================================================
# R-space Range (Å)
# =============================================================================
# Used for auto-generating r_bins or filtering loaded data
r_min: 0.01
r_max: 50.0
n_r_bins: 500

# =============================================================================
# Spectrum Calculation
# =============================================================================
kernel_width: 0.03
number_density: 0.0352  # atoms/Å³

# =============================================================================
# Neutron Scattering Lengths (fm)
# =============================================================================
neutron_scattering_lengths:
  Li: -1.90
  P: 5.13
  S: 2.847

# =============================================================================
# X-ray Form Factor Parameters (Cromer-Mann)
# =============================================================================
xray_form_factor_params:
  Li:
    a: [1.1282, 0.7508, 0.6175, 0.4653]
    b: [3.9546, 1.0524, 85.3905, 168.261]
    c: [0.0377]
  P:
    a: [6.4345, 4.1791, 1.78, 1.4908]
    b: [1.9067, 27.157, 0.526, 68.1645]
    c: [1.1149]
  S:
    a: [6.9053, 5.2034, 1.4379, 1.5863]
    b: [1.4679, 22.2151, 0.2536, 56.172]
    c: [0.8669]

# =============================================================================
# Order Parameters
# =============================================================================
central: 'P'
neighbour: 'S'
cutoff: 5.5

# =============================================================================
# Constraints
# =============================================================================
json_path: ${data.root_dir}/json/glass_67Li2S_small_constraints.json
