# Fe2O3 (Iron Oxide Glass) Data Configuration
# ============================================
# X-ray diffraction data for amorphous Fe2O3

experiment_name: Fe2O3

root_dir: ${oc.env:PROJECT_ROOT,./}/data

# =============================================================================
# Scattering Type: 'neutron' or 'xray'
# =============================================================================
scattering_type: xray

# =============================================================================
# Data Paths
# =============================================================================
data:
  s_of_q_path: ${data.root_dir}/xrd_measurements/Fe2O3/F_of_Q.csv
  t_of_r_path: ${data.root_dir}/xrd_measurements/Fe2O3/T_of_r.csv
  g_of_r_path: null

  # Input format: null=auto-detect, true=F(Q), false=S(Q)
  # F_of_Q.csv contains F(Q)=Q[S(Q)-1] directly
  input_is_F_Q: true

  # Data subsampling (1 = no subsampling)
  stride_q: 1
  stride_r: 1

# =============================================================================
# Q-space Range (Å⁻¹)
# =============================================================================
# Filter experimental S(Q)/F(Q) data to this range
# Set to null to use full data range
q_min: 0.5
q_max: 20.0

# =============================================================================
# R-space Range (Å)
# =============================================================================
# Used for auto-generating r_bins or filtering loaded data
r_min: 0.01
r_max: 10.0
n_r_bins: 500

# =============================================================================
# Spectrum Calculation
# =============================================================================
kernel_width: 0.035

# =============================================================================
# Neutron Scattering Lengths (fm)
# =============================================================================
neutron_scattering_lengths:
  Fe: 9.45
  O: 5.803

# =============================================================================
# X-ray Form Factor Parameters (Cromer-Mann)
# =============================================================================
xray_form_factor_params:
  Fe:
    a: [11.7695, 7.3573, 3.5222, 2.3045]
    b: [4.7611, 0.3072, 15.3535, 76.8805]
    c: [1.0369]
  O:
    a: [3.0485, 2.2868, 1.5463, 0.867]
    b: [13.2771, 5.7011, 0.3239, 32.9089]
    c: [0.2508]

# =============================================================================
# Order Parameters
# =============================================================================
central: 'Fe'
neighbour: 'O'
cutoff: 2.2

# =============================================================================
# Constraints
# =============================================================================
json_path: ${data.root_dir}/json/fe2o3_sc800_constraints.json

# =============================================================================
# F_IS order parameter (local inversion symmetry)
# =============================================================================
# Fe2O3: mixed tet Fe4 + oct Fe6; mean F_IS ≈ 0.50
fis:
  target: 0.50
  weight: 0.5
  cutoff: 2.2
  central_z: 26     # Fe
  neighbor_z: 8     # O
  mode: variable_R

# =============================================================================
# Loss aggregation
# =============================================================================
loss_aggregator:
  name: relobralo
  beta: 0.999
  num_losses: 2

# =============================================================================
# F_IS feedback: dynamic environment priority adjustment
# =============================================================================
# Environments with large F_IS error get higher constraint penalty weight.
# Set enabled: true to activate.  Requires fis: block above.
fis_feedback:
  enabled: false
  update_interval: 200      # steps between priority updates
  feedback_strength: 2.0    # priority_scale = 1 + strength * |F_IS - target|
  min_scale: 0.5            # minimum priority multiplier
  max_scale: 5.0            # maximum priority multiplier
  warmup_steps: 500         # steps before feedback activates
